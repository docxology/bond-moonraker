domain: specialized_agent_mission
display_name: Moonraker DRAX Mission Software
required_packages:
  - numpy
  - matplotlib
  - pyyaml
  - bond-api
preferred_outputs:
  - json
  - png
  - md
validation_gates:
  - mission_method_design
  - artifact_manifest
  - evidence_grounding
  - determinism_check
  - protocol_contract
figure_types:
  - timeline_critical_path
  - orbit_period_windows
  - centrifuge_g_profile
citation_policy: official_or_scholarly
source_policy: "Prefer primary project outputs, official orbital-mechanics references, and the frozen BOND-API protocol contract."
review_gates:
  - mission_method_design
  - determinism_check
  - protocol_contract
artifact_expectations:
  - output/data/mission_results.json
  - output/data/manuscript_variables.json
  - output/figures/timeline_critical_path.png
  - output/figures/orbit_period_windows.png
  - output/figures/centrifuge_g_profile.png
  - output/manuscript/00_abstract.md
benchmark_rubric:
  name: drax-mission-readiness
  dimensions:
    - name: determinism
      weight: 1.0
    - name: protocol_contract
      weight: 1.0
    - name: artifact_manifest
      weight: 1.0
    - name: evidence_grounding
      weight: 1.0
    - name: reproducibility_bundle
      weight: 1.0
llm_prompt_guidance: "Use the deterministic mission results and manuscript variables as the evidence source; do not invent numeric results."
conditions:
  - name: nominal_deadline
    role: reference
    description: "Shuttle point of no return (60 min) within which the hijack timeline must complete."
  - name: tight_deadline
    role: variant
    description: "Stress condition where the deadline falls inside the critical path length."
  - name: high_g
    role: variant
    description: "Centrifuge profile at or above the g-duration tolerance limit."
metrics:
  primary:
    name: timeline_margin_min
    direction: maximize
protocol: "Run the deterministic hijack timeline, orbital-logistics, and centrifuge computations from a single fixed parameter set with identical seeds, tolerances and iteration caps."
expected_figures:
  - fig:timeline
  - fig:orbit
  - fig:centrifuge
expected_tables:
  - tbl:mission_parameters
baselines:
  - nominal_deadline
ablations:
  - tight_deadline
  - high_g
