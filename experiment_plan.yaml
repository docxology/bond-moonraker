mission: drax
basis: Moonraker (1979)
core_concepts:
  - shuttle_ops: "Space-shuttle hijack timeline as a critical-path (CPM) network."
  - orbital_logistics: "Drax station orbital mechanics, launch windows and consumables capacity."
  - centrifuge: "Centrifuge g-force training profiles bounded by a g-tolerance envelope."
entry_points:
  - scripts/run_mission.py
  - src/moonraker/mission.py (BOND-API MissionProvider)
parameters:
  deadline_min: 60.0
  station_altitude_km: 350.0
  crew: 6
  capacity_kg: 5400.0
  rate_kg_per_person_day: 2.0
  resupply_interval_days: 6.0
  centrifuge_target_g: 6.0
  centrifuge_radius_m: 8.0
  g_limit: 9.0
conditions:
  - name: nominal_deadline
    params: {deadline_min: 60.0}
    role: reference
  - name: tight_deadline
    params: {deadline_min: 30.0}
    role: ablation
  - name: high_g
    params: {centrifuge_target_g: 9.0}
    role: ablation
primary_metric:
  name: timeline_margin_min
  direction: maximize
outputs:
  - output/data/mission_results.json
  - output/data/manuscript_variables.json
  - output/figures/timeline_critical_path.png
  - output/figures/orbit_period_windows.png
  - output/figures/centrifuge_g_profile.png
  - output/figures/hohmann_transfer.png
  - output/figures/training_weekly_load.png
