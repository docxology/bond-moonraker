# PROJECT BOND — moonraker (Moonraker, 1979) · mission codename DRAX
# Loaded by src/moonraker/manuscript_variables.py (paper/authors/keywords/mission)
# and by scripts/z_generate_manuscript_variables.py.

paper:
  title: "Moonraker: DRAX — Special-Agent Mission Software"
  subtitle: "Shuttle Hijack Timelining, Space-Station Orbital Logistics and Centrifuge G-Force Profiles"
  version: "0.2.0"
  date: "2026-08-04"

authors:
  - name: "Daniel Ari Friedman"
    orcid: "0000-0001-6232-9096"
    email: "daniel@activeinference.institute"
    affiliation: "Active Inference Institute"
    corresponding: true

# Film identity — this package models Moonraker's DRAX mission.
film: "Moonraker"
codename: "DRAX"

publication:
  # Local-only BOND suite package: no remote, no DOI, never published.
  repository_url: ""
  journal: "PROJECT BOND · film suite"

keywords:
  - "space-shuttle hijack timeline"
  - "critical path method"
  - "space-station orbital logistics"
  - "Kepler orbital mechanics"
  - "launch windows"
  - "centrifuge g-force training"
  - "g-tolerance envelope"
  - "space-station resupply"
  - "reproducible research"

metadata:
  license: "MIT"
  language: "en"

# Mission parameter block — consumed by mission_results.py and
# manuscript_variables.py. Numeric values here are the single source of truth.
mission:
  deadline_min: 60.0        # shuttle's point of no return (minutes from launch)
  station_altitude_km: 350.0
  crew: 6
  capacity_kg: 5400.0       # consumables mass carried by a resupply
  rate_kg_per_person_day: 2.0
  resupply_interval_days: 6.0
  centrifuge_target_g: 6.0
  centrifuge_radius_m: 8.0
  centrifuge_sustain_s: 12.0
  ramp_rate_g_per_s: 0.5
  decay_rate_g_per_s: 1.0
  g_limit: 9.0
  duration_limit_s: 30.0
  # Orbital transfer / rendezvous (phase-4 deepening).
  park_altitude_km: 200.0
  transfer_isp_s: 300.0
  transfer_dry_mass_kg: 2500.0
  deorbit_perigee_km: 100.0
  rendezvous_intercept_s: 1200.0
  # Centrifuge training regimen (phase-4 deepening).
  training_daily_cap_g_s: 150.0
  training_weekly_cap_g_s: 400.0
  training_sessions_per_week: 4
  # Schedule crashing (phase-4 deepening).
  crash_deadline_min: 50.0
