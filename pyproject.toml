# PROJECT BOND — moonraker (Moonraker, 1979) · mission codename DRAX
# Special-agent mission software: space-shuttle hijack timeline modelling,
# Drax space-station orbital logistics, and centrifuge g-force training
# profiles. Standalone member of the BOND suite; published at
# github.com/docxology/bond-moonraker.

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "moonraker"
version = "0.2.0"
license = {text = "MIT"}
description = "DRAX: special-agent mission software — shuttle hijack timelining, orbital logistics, centrifuge g-profiles"
authors = [
    {name = "Daniel Ari Friedman", email = "daniel@activeinference.institute"}
]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.7.0",
    "pyyaml>=6.0",
    "bond-api",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0",
    "ruff>=0.4.0",
    "types-PyYAML>=6.0.12",
]

[tool.uv.sources]
# Sibling checkout of the frozen BOND-API protocol (see AGENTS.md). Relative so
# the package resolves the same way in any clone of the BOND suite.
bond-api = { path = "../bond-api" }

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "tests/*",
    "*/__init__.py",
    "*/test_*.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.10"
mypy_path = ["src"]
explicit_package_bases = true
namespace_packages = true
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
line-length = 99
target-version = "py310"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
